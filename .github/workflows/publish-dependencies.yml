name: Publish Dependencies

# Extracts the build inputs and publishes them as dated release assets so the
# build workflow can fetch them instead of re-downloading every restore image.
# Each restore image gets its own archive (dependencies-YYYYMMDD-<image>.tar.xz)
# to stay under GitHub's 2 GiB release-asset limit; an archive is only split
# into .part-aa, .part-ab, ... if it still exceeds that limit.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 350
    env:
      VZ_BUILD_ROOT: ${{ github.workspace }}/build
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report resources
        run: |
          set -euo pipefail
          echo "===== CPU ====="
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          sysctl hw.physicalcpu hw.logicalcpu 2>/dev/null || true
          echo "===== Memory ====="
          sysctl -n hw.memsize 2>/dev/null |
            awk '{ printf "hw.memsize: %.1f GiB\n", $1 / 1073741824 }' || true
          vm_stat 2>/dev/null | head -n 6 || true
          echo "===== Disk ====="
          df -h

      - name: Install ipsw
        run: |
          set -euo pipefail
          ver=3.1.717
          curl -fsSL -o "$RUNNER_TEMP/ipsw.tar.gz" \
            "https://github.com/blacktop/ipsw/releases/download/v${ver}/ipsw_${ver}_macOS_universal.tar.gz"
          tar -xzf "$RUNNER_TEMP/ipsw.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/ipsw" /usr/local/bin/ipsw
          ipsw version

      - name: Extract inputs
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/ci-extract-inputs.sh
          VZ_IPSW_BIN="$(command -v ipsw)" \
            VirtualMac/scripts/ci-extract-inputs.sh

      # ipsw-a2sb is a locally patched ipsw build (see scripts/bootstrap.sh).
      # The official ipsw release used for extraction cannot produce the
      # address->symbol cache that uncache.py consumes.
      - name: Bootstrap a2sb toolchain
        run: |
          set -euo pipefail
          command -v go >/dev/null 2>&1 || brew install go
          IPSW_SRC="$VZ_BUILD_ROOT/toolchain/ipsw-src"
          IPSW_COMMIT="b7229017247457d7cf310c942dd9910e485624b3"
          mkdir -p "$VZ_BUILD_ROOT/toolchain/bin"
          if [ ! -d "$IPSW_SRC/.git" ]; then
            git clone https://github.com/blacktop/ipsw.git "$IPSW_SRC"
          fi
          git -C "$IPSW_SRC" fetch --quiet origin "$IPSW_COMMIT"
          git -C "$IPSW_SRC" checkout --detach --quiet "$IPSW_COMMIT"
          install -m 0644 \
            "$GITHUB_WORKSPACE/VirtualMac/vz/ipsw_patches/dyld_a2sb.go" \
            "$IPSW_SRC/cmd/ipsw/cmd/dyld/dyld_a2sb.go"
          (
            cd "$IPSW_SRC"
            CGO_ENABLED=1 go build -o "$VZ_BUILD_ROOT/toolchain/bin/ipsw-a2sb" ./cmd/ipsw
          )
          "$VZ_BUILD_ROOT/toolchain/bin/ipsw-a2sb" dyld a2sb --help >/dev/null

      # uncache.py resolves bind targets via "ipsw dyld a2sb --cache <dsc>.a2s".
      # Building that cache scans the whole shared cache and took hours on a
      # cold runner, so generate it here and ship it beside the DSC in the
      # dependencies release. The build workflow then reuses it.
      - name: Pre-generate a2s symbol caches
        run: |
          set -euo pipefail
          A2SB="$VZ_BUILD_ROOT/toolchain/bin/ipsw-a2sb"
          EMPTY="$(mktemp)"
          while IFS= read -r -d '' dsc; do
            if [ -f "$dsc.a2s" ]; then
              echo "reusing existing a2s cache: $dsc.a2s"
              continue
            fi
            echo "building a2s cache: $dsc"
            "$A2SB" --no-color dyld a2sb --cache "$dsc.a2s" "$dsc" "$EMPTY"
            ls -lh "$dsc.a2s"
          done < <(find "$VZ_BUILD_ROOT/inputs" -type f \
            -name 'dyld_shared_cache_arm64e' -print0)
          rm -f "$EMPTY"

      - name: Package dependencies by restore image
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          command -v xz >/dev/null 2>&1 || brew install xz

          DATE="$(date -u +%Y%m%d)"
          NAME="dependencies-$DATE"
          echo "DEP_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/$NAME"-*.tar.xz*

          package_one() {
            local dir="$1"
            local label="$2"
            local archive="$RUNNER_TEMP/$NAME-$label.tar.xz"
            if [ ! -d "$dir" ]; then
              echo "missing $dir" >&2
              return 1
            fi
            echo "packing $dir -> $archive"
            tar -C "$(dirname "$dir")" -cf - "$(basename "$dir")" \
              | xz -T0 -6 > "$archive"
            local size
            size="$(stat -f %z "$archive")"
            if [ "$size" -gt $((1900 * 1024 * 1024)) ]; then
              echo "$label exceeds 2 GiB, splitting"
              split -b 1900m "$archive" "$archive.part-"
              rm -f "$archive"
            fi
          }

          package_one "$VZ_BUILD_ROOT/inputs/macos"    "macos-13.2.1"
          package_one "$VZ_BUILD_ROOT/inputs/macos11"  "macos-11.6"
          package_one "$VZ_BUILD_ROOT/inputs/ipados14" "ipados-14.5"
          ls -lh "$RUNNER_TEMP/$NAME"-* 2>/dev/null || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME="$DEP_NAME"
          ASSETS=()
          for f in "$RUNNER_TEMP/$NAME"-*.tar.xz "$RUNNER_TEMP/$NAME"-*.tar.xz.part-*; do
            if [ -e "$f" ]; then
              ASSETS+=("$f")
            fi
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "no assets produced" >&2
            exit 1
          fi

          NOTES="Build inputs grouped by restore image, published $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA}."
          if gh release view "$NAME" >/dev/null 2>&1; then
            gh release upload "$NAME" --clobber "${ASSETS[@]}"
          else
            gh release create "$NAME" --title "$NAME" --notes "$NOTES" "${ASSETS[@]}"
          fi
          echo "published $NAME with ${#ASSETS[@]} asset(s)"
